document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box;margin:0;padding:0}\n  html{scroll-behavior:smooth}\n  body{background:#FBFBF9;font-family:'Readex Pro',sans-serif;-webkit-font-smoothing:antialiased;color:#0A0A0A}\n  ::selection{background:#0A0A0A;color:#fff}\n  @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}\n  @keyframes up{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}\n  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}\n  a{color:inherit}\n  @keyframes fabIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}\n  @keyframes sheetIn{from{transform:translateY(20px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}\n  @keyframes fadeIn{from{opacity:0}to{opacity:1}}\n  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;height:22px}\n  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:transparent}\n  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:20px;width:20px;border-radius:50%;background:#fff;border:2px solid #0E9F6E;box-shadow:0 2px 7px rgba(14,159,110,.45);margin-top:-8px}\n  input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:transparent}\n  input[type=range]::-moz-range-thumb{height:18px;width:18px;border-radius:50%;background:#fff;border:2px solid #0E9F6E}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div dir=\"rtl\" style=\"background:#FBFBF9;min-height:100vh;overflow-x:hidden\">\n\n  <!-- NAV -->\n  <header style=\"position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(251,251,249,.8);border-bottom:1px solid #EDEDE8\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"width:30px;height:30px;border-radius:8px;background:#0A0A0A;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px\">J<\u002Fdiv>\n        <span style=\"font-weight:600;font-size:17px;letter-spacing:-.3px\">jbr<span style=\"color:#0E9F6E\">seo<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px\">\n        <div style=\"display:flex;gap:4px;font-size:13px;color:#6B6B66\">\n          <button onclick=\"{{ setSA }}\" style=\"{{ saStyle }}\">السعودية<\u002Fbutton>\n          <button onclick=\"{{ setEG }}\" style=\"{{ egStyle }}\">مصر<\u002Fbutton>\n        <\u002Fdiv>\n        <a href=\"#pricing\" style=\"background:#0A0A0A;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:500;text-decoration:none\">ابدأ الحين<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section style=\"max-width:760px;margin:0 auto;padding:88px 28px 28px;text-align:center\">\n    <div style=\"font-size:14px;color:#6B6B66;font-weight:500;letter-spacing:.2px;margin-bottom:26px\">سيو بالاشتراك الشهري · السعودية ومصر<\u002Fdiv>\n    <h1 style=\"font-size:64px;line-height:1.08;font-weight:600;letter-spacing:-2px;text-wrap:balance\">\n      نخلّيك في <span style=\"color:#0E9F6E\">المركز الأول<\u002Fspan><br>على جوجل.\n    <\u002Fh1>\n    <p style=\"font-size:20px;line-height:1.7;color:#52524C;margin:26px auto 0;max-width:520px;font-weight:300;text-wrap:pretty\">\n      فريقنا يكتب محتوى سيو وينشره على موقعك. أنت توافق بضغطة — وجوجل يجيب لك العملاء كل يوم. بدون إعلانات، بدون فريق داخلي.\n    <\u002Fp>\n    <div style=\"display:flex;gap:12px;justify-content:center;margin-top:32px;flex-wrap:wrap\">\n      <a href=\"#pricing\" style=\"background:#0A0A0A;color:#fff;padding:15px 28px;border-radius:12px;font-size:16px;font-weight:500;text-decoration:none\">ابدأ الحين — بدون بطاقة<\u002Fa>\n      <a href=\"{{ waLink }}\" style=\"background:#fff;color:#0A0A0A;padding:15px 24px;border-radius:12px;font-size:16px;font-weight:500;text-decoration:none;border:1px solid #E2E2DC\">تواصل واتساب<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;color:#9A9A93;margin-top:18px\">بدون بطاقة · ضمان استرجاع ١٤ يوم · دعم عربي ١٠٠٪<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LIVE SERP -->\n  <section style=\"max-width:640px;margin:0 auto;padding:34px 28px 20px\">\n    <div style=\"background:#fff;border:1px solid #E8E8E2;border-radius:20px;box-shadow:0 30px 60px -36px rgba(10,10,10,.28);overflow:hidden\">\n      <!-- search bar -->\n      <div style=\"display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid #F0F0EA\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9A9A93\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"21\" y1=\"21\" x2=\"16.5\" y2=\"16.5\"><\u002Fline><\u002Fsvg>\n        <div style=\"font-size:15px;color:#2A2A26;flex:1;font-weight:400\">{{ query }}<span style=\"display:inline-block;width:1.5px;height:16px;background:#0A0A0A;vertical-align:-3px;margin-right:2px;animation:caret 1s step-end infinite\"><\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#B8B8B0\">بحث جوجل<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- results -->\n      <div style=\"position:relative;height:{{ boardHeight }};padding:10px 14px;background:#FCFCFA\">\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"{{ r.boxStyle }}\">\n            <div style=\"display:flex;align-items:center;gap:13px;height:100%\">\n              <div style=\"{{ r.rankStyle }}\">{{ r.rankLabel }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"{{ r.titleStyle }}\">{{ r.title }}<\u002Fspan>\n                  <sc-if value=\"{{ r.showAd }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px;font-weight:600;color:#B26B00;background:#FFF3DC;padding:1px 6px;border-radius:5px;font-family:'IBM Plex Mono',monospace\">إعلان<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ r.isYou }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:600;color:#0E9F6E;background:#E6F7EF;padding:2px 8px;border-radius:6px\">موقعك<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:{{ r.urlColor }};margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.url }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ r.rising }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:4px;color:#0E9F6E;font-size:12px;font-weight:600;font-family:'IBM Plex Mono',monospace;animation:up 1s ease-in-out infinite\">▲ يصعد<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.won }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"color:#0E9F6E;font-size:13px;font-weight:600;animation:pop .4s ease both\">المركز الأول ✓<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center;font-size:13px;color:#9A9A93;margin-top:16px\">من الصفحة الخامسة إلى المركز الأول — هذا اللي نسوّيه لموقعك.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HOW (one calm line) -->\n  <section style=\"max-width:880px;margin:0 auto;padding:72px 28px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;text-align:center\">\n      <sc-for list=\"{{ how }}\" as=\"h\" hint-placeholder-count=\"3\">\n        <div style=\"{{ h.cellStyle }}\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#B8B8B0;margin-bottom  ? 'ر.س' : 'ج.م'; }\n  fmt(n){ return Math.round(n).toLocaleString('en-US'); }\n  setMarket(m){ return ()=>this.setState({market:m}); }\n  setBilling(b){ return ()=>this.setState({billing:b}); }\n  setSalary(key){ return (e)=>this.setState({salaries:{...this.state.salaries,[key]:+e.target.value}}); }\n\n  renderVals(){\n    const { market, billing, queryIdx, order } = this.state;\n    const cur=this.cur();\n    const wa='https://wa.me/'+(market==='sa'?'966541018020':'201000000000');\n    const youAtTop = order[0]==='you';\n    const youIdx = order.indexOf('you');\n\n    const segBtn=(on)=>({padding:'6px 12px',borderRadius:'8px',border:'none',cursor:'pointer',fontFamily:'inherit',fontWeight:500,fontSize:'13px',background:on?'#0A0A0A':'transparent',color:on?'#fff':'#9A9A93',transition:'all .15s'});\n    const pillBtn=(on)=>({padding:'9px 18px',borderRadius:'9px',border:'none',cursor:'pointer',fontFamily:'inherit',fontWeight:500,fontSize:'14px',background:on?'#fff':'transparent',color:on?'#0A0A0A':'#7A7A73',boxShadow:on?'0 1px 3px rgba(0,0,0,.08)':'none',transition:'all .15s'});\n\n    // SERP rows\n    const all=[...this.comps,{id:'you',title:'نشاطك التجاري',url:'your-business.com',you:true}];\n    const rows=all.map(item=>{\n      const idx=order.indexOf(item.id);\n      const isYou=!!item.you;\n      const rising=isYou && !youAtTop;\n      const won=isYou && youAtTop;\n      const dim = !isYou;\n      return {\n        title:item.title, url:item.url, isYou,\n        showAd: !!item.ad && idx===order.indexOf('ad') && order.indexOf('ad')<youIdx,\n        rising, won, isYou,\n        urlColor: isYou ? '#0E9F6E' : (dim?'#B0B0A8':'#A8A8A0'),\n        boxStyle:{\n          position:'absolute',left:'14px',right:'14px',top:(idx*this.ROWH+6)+'px',height:(this.ROWH-8)+'px',\n          padding:'0 14px',borderRadius:'12px',\n          background: isYou ? '#fff' : 'transparent',\n          border: isYou ? '1.5px solid #0E9F6E' : '1px solid transparent',\n          boxShadow: isYou ? '0 10px 26px -12px rgba(14,159,110,.45)' : 'none',\n          transition:'top .55s cubic-bezier(.34,1.2,.34,1), box-shadow .4s, border-color .4s, transform .4s',\n          transform: won ? 'scale(1.015)' : 'scale(1)',\n          zIndex: isYou ? 5 : 1,\n        },\n        rankStyle:{\n          fontFamily:\"'IBM Plex Mono',monospace\",fontSize:'13px',fontWeight:600,width:'30px',height:'30px',flexShrink:0,\n          display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'8px',\n          background: isYou ? (won?'#0E9F6E':'#E6F7EF') : '#F0F0EA',\n          color: isYou ? (won?'#fff':'#0E9F6E') : '#9A9A93',\n          transition:'all .4s',\n        },\n        rankLabel:'#'+(idx+1),\n        titleStyle:{fontSize:'14.5px',fontWeight: isYou?600:400,color: isYou?'#0A0A0A':(dim?'#86867E':'#52524C'),whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'},\n      };\n    });\n\n    // how\n    const how=[\n      {no:'٠١',title:'اشترك',body:'اختر باقتك وتعبّأ استمارة قصيرة مرة وحدة.'},\n      {no:'٠٢',title:'نكتب وننشر',body:'فريقنا يجهّز المحتوى وينشره على موقعك تلقائياً.'},\n      {no:'٠٣',title:'تتصدّر جوجل',body:'تظهر في البحث، والعملاء يجونك كل يوم.'},\n    ].map((h,i)=>({...h, cellStyle:{padding:'8px 24px', borderRight: i<2 ? '1px solid #EDEDE8' : 'none'}}));\n\n    // math\n    const teamMonthly=37000;\n    const subStart=100;\n\n    // pricing\n    const annual=billing==='annual';\n    const data=[\n      {name:'الحضور',tagline:'صفحة احترافية تحكي قصتك وخبراتك.',m:100,a:100,feat:['مقال احترافي يعكس خبرتك','صفحة تعريفية جاهزة للمشاركة','رابط خاص تشاركه مع عملائك'],featured:false},\n      {name:'الانطلاقة',tagline:'٤ مقالات شهرياً — نكتب وأنت تستقبل العملاء.',m:499,a:399,feat:['٤ مقالات كل شهر','نشر تلقائي على موقعك','توزيع على ٣ منصات'],featured:false},\n      {name:'الزخم',tagline:'نشيل عنك هم المحتوى بالكامل.',m:1299,a:1039,feat:['٨ مقالات + ريلز شهرياً','توزيع على ٨ منصات','تمييز العميل الجاهز للشراء'],featured:true},\n      {name:'الريادة',tagline:'لنشاطك اللي كبر ويستاهل فريق متكامل.',m:2999,a:2399,feat:['١٢ مقالاً كل شهر','جلسة استراتيجية شهرية','مدير حساب خاص فيك'],featured:false},\n    ];\n    const plans=data.map(p=>{\n      const price=annual?p.a:p.m;\n      const f=p.featured;\n      return {\n        name:p.name, tagline:p.tagline, price:this.fmt(price),\n        note: annual ? ('سنوياً '+this.fmt(price*12)+' '+cur) : 'يُدفع شهرياً',\n        features:p.feat,\n        nameColor: f?'#fff':'#0A0A0A',\n        priceColor: f?'#fff':'#0A0A0A',\n        subColor: f?'#9A9A93':'#9A9A93',\n        featColor: f?'#C8C8C2':'#52524C',\n        checkColor: f?'#0E9F6E':'#0E9F6E',\n        cta: f?'ابدأ الحين':'اختر',\n        cardStyle:{borderRadius:'18px',padding:'26px 22px',background:f?'#0A0A0A':'#fff',border:f?'none':'1px solid #E8E8E2',boxShadow:f?'0 24px 50px -22px rgba(10,10,10,.5)':'none'},\n        ctaStyle:{display:'block',textAlign:'center',background:f?'#fff':'#0A0A0A',color:f?'#0A0A0A':'#fff',padding:'12px',borderRadius:'10px',fontWeight:600,fontSize:'14px',textDecoration:'none',marginTop:'18px'},\n        dividerStyle:{height:'1px',background:f?'rgba(255,255,255,.12)':'#F0F0EA',margin:'18px 0'},\n      };\n    });\n\n    // calculator\n    const roleMeta=[\n      {key:'writer',label:'كاتب محتوى SEO',min:2500,max:12000},\n      {key:'designer',label:'مصمم جرافيك',min:2000,max:12000},\n      {key:'seo',label:'متخصص SEO',min:3000,max:14000},\n      {key:'social',label:'مدير سوشال ميديا',min:2500,max:12000},\n      {key:'video',label:'مونتير / منتج فيديو',min:2500,max:14000},\n      {key:'dev',label:'مطور مواقع',min:3000,max:18000},\n    ];\n    const sal=this.state.salaries;\n    const roles=roleMeta.map(r=>{\n      const v=sal[r.key];\n      const pct=Math.max(0,Math.min(100,((v-r.min)/(r.max-r.min))*100));\n      return { label:r.label, min:r.min, max:r.max, step:100, val:v,\n        valLabel:this.fmt(v)+' '+cur, onInput:this.setSalary(r.key),\n        fillStyle:{position:'absolute',right:0,height:'5px',borderRadius:'99px',background:'#0E9F6E',width:pct+'%'} };\n    });\n    const calcTeamMonthly=Object.values(sal).reduce((a,b)=>a+b,0);\n    const teamAnnual=calcTeamMonthly*12;\n    const subAnnual=12468;\n    const savingsAmount=Math.max(0,teamAnnual-subAnnual);\n    const savingsPct=Math.max(0,Math.round((1-subAnnual/teamAnnual)*100));\n\n    return {\n      waLink:wa, curName:cur,\n      calcOpen:this.state.calcOpen,\n      openCalc:()=>this.setState({calcOpen:true}),\n      closeCalc:()=>this.setState({calcOpen:false}),\n      stopProp:(e)=>e.stopPropagation(),\n      roles,\n      teamAnnualLabel:this.fmt(teamAnnual)+' '+cur,\n      subAnnualLabel:this.fmt(subAnnual)+' '+cur,\n      savingsPctLabel:savingsPct+'%',\n      savingsAmountLabel:this.fmt(savingsAmount),\n      setSA:this.setMarket('sa'), setEG:this.setMarket('eg'),\n      saStyle:segBtn(market==='sa'), egStyle:segBtn(market==='eg'),\n      setMonthly:this.setBilling('monthly'), setAnnual:this.setBilling('annual'),\n      monStyle:pillBtn(!annual), annStyle:pillBtn(annual),\n      query:this.queries[queryIdx],\n      boardHeight:(all.length*this.ROWH+12)+'px',\n      rows, how, plans,\n      teamCost:this.fmt(teamMonthly), subCost:this.fmt(subStart),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
